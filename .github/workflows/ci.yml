name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build native wheel on Python 3.14
        run: |
          python -m pip install --disable-pip-version-check 'maturin>=1.8,<2'
          python packaging/build_native_release.py --out dist-native
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist-native/*.whl
          python -c "import kitt_native; print(kitt_native.__file__)"
